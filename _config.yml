title: ICDS Upskilling Resources
description: Community-curated learning resources for the Penn State community, across the five ICDS research hubs.

# Minima ships a default.html layout, so pages with `layout: default`
# in their front matter render inside it instead of erroring on a
# missing layout. (GitHub Pages defaults to jekyll-theme-primer if this
# isn't set; this just picks a specific theme deliberately.)
theme: minima

markdown: kramdown

# The site nav. _includes/header.html loops over this list, so adding a
# hub here is all it takes to put it in the nav bar. Order is the order
# shown.
#
# URLs must end in /README.html, not a bare folder path. On this site
# jekyll-readme-index only turns the *root* README.md into the site's
# index page; a README.md inside a folder is published at
# <folder>/README.html, and a bare <folder>/ URL returns 404. The
# `relative_url` filter in header.html prepends the baseurl that GitHub
# Pages sets for a project site, so these stay root-relative here.
hubs:
  - name: Artificial Intelligence
    url: /ai/README.html
  - name: Computational Sciences
    url: /computational/README.html
  - name: Data Sciences
    url: /data/README.html
  - name: Digital Twins
    url: /digital-twins/README.html
  - name: Quantum Sciences
    url: /quantum/README.html

# Note: GitHub Pages bundles the jekyll-optional-front-matter plugin, so
# front matter is NOT required for a markdown file to become a page.
# The files that don't build (CONTRIBUTING.md, LICENSE.md,
# CODE_OF_CONDUCT.md) are excluded because their exact filenames match
# GitHub's reserved "community health file" list, not because they lack
# front matter. See contributing-page.md / license-page.md /
# code-of-conduct-page.md for the workaround (mirror pages with a
# different filename and an explicit permalink).
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: default

# Keep internal/non-public files out of the built site.
exclude:
  - CLAUDE.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .gitignore
  - .claudeignore
